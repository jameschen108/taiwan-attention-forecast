# 台股長尾關注度專案設定（PRD §3、§5）
# 所有門檻寫死於此，不得在分析中臨時調整（PRD §3.2.1 第 4 點）。

sample:
  # PTT 封存實得範圍 2015-04-27 ~ 2025-01-24；起點規則取第一個完整月份（PRD §3.1）
  ptt_archive_start: "2015-04-27"
  ptt_archive_end: "2025-01-24"
  main_start: "2015-05-01"       # 第一個完整月份
  main_end: "2024-12-31"         # 最後一個完整月份
  price_backfill_start: "2014-01-01"   # 供 25 週動能與領先落後對齊
  price_backfill_end: "2025-03-31"     # 供最後一週的次週報酬
  week_anchor: "W-SUN"           # 星期日錨定（PRD §3.1）
  pilot_months: 32               # Pilot 子期間

attention:
  lookback_weeks: 8              # AbnAtt 回顧窗（PRD §3.2）
  min_periods: 8                 # 不足 8 週維持缺值
  transform: log1p               # PTT 的零是真實的零（PRD §3.2）
  sparsity_lookback_weeks: 52
  # 大量清單型貼文（指數成分股表、薪資表、程式選股輸出）一次列出數十至兩百多檔，
  # 是資料傾印而非對個股的關注。超過此門檻的文章標記 is_bulk_listing，主規格排除。
  max_tickers_per_article: 15
  exclude_bulk_listing: true
  bulk_listing_sensitivity_grid: [5, 10, 15, 20, 30, 999]

sparsity:
  # PRD §3.2.1 三個 tier 的門檻；§5.11-1 對此做敏感度測試
  dense_min_nonzero_weeks: 40
  silent_max_nonzero_weeks: 3
  sensitivity_grid:
    dense_min_nonzero_weeks: [30, 35, 40, 45, 50]
    silent_max_nonzero_weeks: [1, 3, 5, 8]

sessions:
  market_open_minute: 540        # 09:00
  market_close_minute: 810       # 13:30

effort:
  # PRD §3.3。實測語料另有「情報」（11%）、創作、爆卦、投顧，PRD 原清單未涵蓋。
  high_effort:
    categories: ["標的"]
    original_only: true          # 僅原PO，不含 Re:
  mid_effort:
    categories: ["請益", "心得", "標的"]
    include_replies: true
  low_effort:
    categories: ["新聞", "閒聊", "情報", "公告"]
  # 推文未保存作者與時戳，low_effort 定義為「不含推文」（PRD §3.3 的明文備案）
  pushes_have_timestamps: false

imbalance:
  min_daily_volume_shares: 10000   # 低於此的交易日自 ROI 週聚合排除（PRD §3.7）
  min_valid_days_per_week: 3       # 一週有效交易日不足 3 天則 ROI 缺值
  sensitivity_grid:
    min_daily_volume_shares: [0, 5000, 10000, 20000, 50000]

returns:
  min_trading_days_per_week: 5     # 不完整週標記；主分析剔除（PRD §3.9）
  benchmarks: ["week_fe", "taiex", "sample_equal_weight"]

portfolio:
  n_quantiles: 5
  # PRD §5.7 成本後報酬
  fee_rate: 0.001425               # 單邊手續費
  fee_discount: 0.6                # 常見電子下單折扣
  tax_rate: 0.003                  # 賣出證交稅
  slippage_bps: 20                 # 以買賣價差估計的滑價（單邊）
  tradability_min_daily_value_twd: 5000000   # 週日均成交金額門檻

institutions:
  # PRD §3.9 制度斷點
  price_limit_change: "2015-06-01"     # 漲跌幅 7% → 10%
  day_trade_tax_cut: "2017-04-28"
  continuous_trading: "2020-03-23"     # 盤中逐筆交易
  odd_lot_trading: "2020-10-26"        # 盤中零股交易
  sector_reclassification: "2023-01-01"

regression:
  cluster: ["ticker", "week"]      # 雙重 cluster（PRD §5.1）
  fixed_effects: ["ticker", "week"]
  winsorize: [0.01, 0.99]          # 僅穩健性使用（PRD §5.11-5）
  standardize_within: sparsity_tier

validity:
  # PRD §3.10
  min_code_name_corr: 0.5
  manual_review_per_tier: 50
  manual_review_per_collision_member: 20
